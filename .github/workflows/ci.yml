name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build protocol
        run: npm run build -w @pro-gyakuten/protocol

      - name: Build core
        run: npm run build -w @pro-gyakuten/core

      - name: Test core (73 tests)
        run: npm run test -w @pro-gyakuten/core

      - name: Build server
        run: npm run build -w @pro-gyakuten/server

      - name: Test server
        run: npm run test -w @pro-gyakuten/server

      - name: Build client
        run: npm run build -w @pro-gyakuten/client
