services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - TURSO_URL=file:/data/gyakuten.db
    volumes:
      - db-data:/data
    restart: unless-stopped

  client:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./apps/client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
